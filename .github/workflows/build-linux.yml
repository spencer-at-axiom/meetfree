# Manual Linux builds for MeetFree (Tauri + OpenBLAS CPU path, per desktop/src-tauri/Cargo.toml).
# Delegates to .github/workflows/build.yml — keep logic in one place.

name: Build and Test - Linux

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Cargo profile'
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      ubuntu-version:
        description: 'GitHub-hosted Ubuntu image'
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04
        default: ubuntu-22.04
      bundle-type:
        description: 'Linux bundle targets (all = deb on 22.04, appimage+rpm on 24.04)'
        required: true
        type: choice
        options:
          - deb
          - appimage
          - rpm
          - all
        default: all
      upload-artifacts:
        description: 'Upload build artifacts to the workflow run'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  WHISPER_NO_AVX: ON
  WHISPER_NO_AVX2: ON

jobs:
  prepare:
    name: Prepare Linux bundle args
    runs-on: ubuntu-latest
    outputs:
      build-args: ${{ steps.set.outputs.build-args }}
      is-debug: ${{ steps.set.outputs.is-debug }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          UBUNTU="${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }}"
          BUNDLE="${{ github.event.inputs.bundle-type }}"
          BT="${{ github.event.inputs.build-type }}"

          if [[ "$BT" == "debug" ]]; then
            echo "is-debug=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-debug=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -z "$BUNDLE" || "$BUNDLE" == "all" ]]; then
            if [[ "$UBUNTU" == "ubuntu-24.04" ]]; then
              BUNDLES="appimage,rpm"
            else
              BUNDLES="deb"
            fi
          else
            BUNDLES="$BUNDLE"
          fi

          {
            echo "build-args<<EOF"
            echo "--bundles $BUNDLES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux (x64)
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }}
      target: x86_64-unknown-linux-gnu
      build-args: ${{ needs.prepare.outputs.build-args }}
      is-debug-build: ${{ needs.prepare.outputs.is-debug == 'true' }}
      asset-prefix: meetfree-linux
      upload-artifacts: ${{ github.event.inputs.upload-artifacts }}
      sign-binaries: false
    secrets: inherit
