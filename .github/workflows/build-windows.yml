# Manual Windows builds for MeetFree (Tauri + Vulkan Whisper path).
# Delegates to .github/workflows/build.yml — DigiCert signing lives there.

name: Build and Test - Windows

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: "Cargo profile"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      sign-build:
        description: "Code-sign installers via DigiCert KeyLocker (requires repo secrets)"
        required: true
        type: boolean
        default: true
      upload-artifacts:
        description: "Upload build artifacts to the workflow run"
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Windows build profile
    runs-on: ubuntu-latest
    outputs:
      is-debug: ${{ steps.set.outputs.is-debug }}
    steps:
      - id: set
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.build-type }}" == "debug" ]]; then
            echo "is-debug=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-debug=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows (x64)
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: ""
      is-debug-build: ${{ needs.prepare.outputs.is-debug == 'true' }}
      asset-prefix: meetfree-windows
      upload-artifacts: ${{ github.event.inputs.upload-artifacts == 'true' }}
      sign-binaries: ${{ github.event.inputs.sign-build == 'true' }}
    secrets: inherit
