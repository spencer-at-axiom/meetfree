# Manual macOS builds for MeetFree (Tauri, Apple Silicon aarch64 only).
# Delegates to .github/workflows/build.yml — keep logic in one place.

name: Build and Test - macOS

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Cargo profile'
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      sign-build:
        description: 'Code-sign with Apple Developer ID (requires repo secrets)'
        required: true
        type: boolean
        default: true
      upload-artifacts:
        description: 'Upload build artifacts to the workflow run'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare macOS build profile
    runs-on: ubuntu-latest
    outputs:
      is-debug: ${{ steps.set.outputs.is-debug }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.build-type }}" == "debug" ]]; then
            echo "is-debug=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-debug=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: macos-latest
      target: aarch64-apple-darwin
      build-args: ""
      is-debug-build: ${{ needs.prepare.outputs.is-debug == 'true' }}
      asset-prefix: meetfree-macos
      upload-artifacts: ${{ github.event.inputs.upload-artifacts }}
      sign-binaries: ${{ github.event.inputs.sign-build }}
    secrets: inherit
