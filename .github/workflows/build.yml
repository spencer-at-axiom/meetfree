name: "Build"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
        default: "meetfree"
      asset-name-pattern:
        required: false
        type: string
        default: ""
      upload-artifacts:
        required: false
        type: boolean
        default: false
      sign-binaries:
        required: false
        type: boolean
        default: false
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      is-debug-build:
        required: false
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' desktop/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          if [[ "${{ inputs.is-debug-build }}" == "true" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
          fi

      # ── Node / pnpm ──────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ── Rust ──────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(inputs.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ inputs.platform }}-${{ inputs.target }}

      # ── Linux dependencies (unpinned WebKitGTK 4.1) ──────────────
      - name: Install dependencies (Ubuntu 24.04)
        if: contains(inputs.platform, 'ubuntu-24.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libopenblas-dev \
            libx11-dev libxtst-dev libxrandr-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            gir1.2-webkit2-4.1 gir1.2-javascriptcoregtk-4.1 \
            fuse libfuse2

      - name: Install dependencies (Ubuntu 22.04)
        if: contains(inputs.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libopenblas-dev \
            libx11-dev libxtst-dev libxrandr-dev \
            libwebkit2gtk-4.1-dev \
            fuse libfuse2

      # ── Windows: Vulkan SDK ──────────────────────────────────────
      - name: Install Vulkan SDK (Windows)
        if: contains(inputs.platform, 'windows')
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Configure Vulkan SDK (Windows)
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          $vulkanSdk = $env:VULKAN_SDK
          if (-not $vulkanSdk -or -not (Test-Path $vulkanSdk)) {
            Write-Error "VULKAN_SDK not set or path does not exist"
            exit 1
          }

          $binDir  = Join-Path $vulkanSdk "Bin"
          $libDir  = Join-Path $vulkanSdk "Lib"
          $includeDir = Join-Path $vulkanSdk "Include"

          Write-Host "VULKAN_SDK=$vulkanSdk  Bin=$(Test-Path $binDir)  Lib=$(Test-Path $libDir)  Include=$(Test-Path $includeDir)"

          if (-not $env:PATH.Contains($binDir)) {
            "PATH=$binDir;$($env:PATH)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "Vulkan_LIBRARY=$libDir\vulkan-1.lib"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_INCLUDE_DIR=$includeDir"        | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VK_SDK_PATH=$vulkanSdk"                | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Copy Vulkan runtime for bundling (Windows)
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          $runtimeDir = "desktop/src-tauri/vulkan-runtime"
          if (!(Test-Path $runtimeDir)) { New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null }

          $candidates = @(
            "$env:VULKAN_SDK\Bin\vulkan-1.dll",
            "$env:VULKAN_SDK\runtime\x64\vulkan-1.dll",
            "$env:SystemRoot\System32\vulkan-1.dll"
          )

          $found = $false
          foreach ($p in $candidates) {
            if (Test-Path $p) {
              Copy-Item $p -Destination $runtimeDir
              Write-Host "Copied vulkan-1.dll from $p"
              $found = $true
              break
            }
          }
          if (-not $found) { Write-Warning "vulkan-1.dll not found; user's installed runtime will be used" }

      # ── Windows: DigiCert code-signing ────────────────────────────
      - name: Setup DigiCert Environment
        if: ${{ contains(inputs.platform, 'windows') && inputs.sign-binaries }}
        shell: pwsh
        run: |
          "SM_HOST=${{ secrets.SM_HOST }}"                                       | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SM_API_KEY=${{ secrets.SM_API_KEY }}"                                 | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}"       | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SM_CODE_SIGNING_CERT_SHA1_HASH=${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $certPath = "D:\Certificate_pkcs12.p12"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String("${{ secrets.SM_CLIENT_CERT_FILE_B64 }}"))

          if (!(Test-Path $certPath)) { Write-Error "Certificate not written to $certPath"; exit 1 }
          Write-Host "Certificate written ($((Get-Item $certPath).Length) bytes)"
          "SM_CLIENT_CERT_FILE=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup DigiCert KeyLocker
        if: ${{ contains(inputs.platform, 'windows') && inputs.sign-binaries }}
        uses: digicert/ssm-code-signing@v1.1.1

      - name: Sync certificate to Windows store
        if: ${{ contains(inputs.platform, 'windows') && inputs.sign-binaries }}
        shell: pwsh
        run: |
          $keypairOutput = smctl keypair ls 2>&1 | Out-String
          $match = [regex]::Match($keypairOutput, 'key_\d+')
          if (-not $match.Success) { Write-Error "No keypair alias found"; exit 1 }
          $alias = $match.Value
          Write-Host "Keypair alias: $alias"

          smctl windows certsync --keypair-alias $alias
          if ($LASTEXITCODE -ne 0) { Write-Error "Certificate sync failed"; exit 1 }

          "DIGICERT_KEYPAIR_ALIAS=$alias" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Certificate synced and alias exported"

      - name: Verify DigiCert setup
        if: ${{ contains(inputs.platform, 'windows') && inputs.sign-binaries }}
        shell: pwsh
        run: |
          smctl --version
          smctl healthcheck

      # ── macOS: Apple code-signing ─────────────────────────────────
      - name: Import Apple Developer Certificate
        if: ${{ contains(inputs.platform, 'macos') && inputs.sign-binaries }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify Apple certificate
        if: ${{ contains(inputs.platform, 'macos') && inputs.sign-binaries }}
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV

      # ── Frontend + build ──────────────────────────────────────────
      - name: Install desktop dependencies
        run: cd desktop && pnpm install

      - name: Add Rust target (cross-compile only)
        if: ${{ inputs.target != '' && !contains(inputs.target, 'unknown-linux-gnu') && !contains(inputs.target, 'pc-windows-msvc') }}
        run: rustup target add ${{ inputs.target }}

      - name: Patch asset name pattern
        id: patch-release-name
        shell: bash
        if: ${{ inputs.release-id != '' && inputs.asset-name-pattern != '' }}
        run: |
          platform="${{ inputs.platform }}"
          replacement="$(echo ${platform} | sed -E 's/-latest//')"
          patched=$(echo '${{ inputs.asset-name-pattern }}' | sed -E "s/\[platform\]/${replacement}/")
          if [[ -n "${{ inputs.asset-prefix }}" ]]; then
            patched="${{ inputs.asset-prefix }}_${patched}"
          fi
          echo "platform=${patched}" >> $GITHUB_OUTPUT

      - name: Determine build features
        id: build-features
        shell: bash
        run: |
          FEATURES=""
          if [[ "${{ inputs.platform }}" == *"windows"* ]]; then
            FEATURES="--features vulkan"
          elif [[ "${{ inputs.platform }}" == *"ubuntu"* ]]; then
            FEATURES="--features openblas"
          fi
          echo "features=$FEATURES" >> "$GITHUB_OUTPUT"

      - name: Compose Tauri CLI args
        id: tauri-args
        shell: bash
        run: |
          set -euo pipefail
          FULL=""
          [[ "${{ inputs.is-debug-build }}" == "true" ]] && FULL="--debug"
          [[ -n "${{ inputs.build-args }}" ]] && FULL="$FULL ${{ inputs.build-args }}"
          [[ -n "${{ steps.build-features.outputs.features }}" ]] && FULL="$FULL ${{ steps.build-features.outputs.features }}"
          [[ -n "${{ inputs.target }}" ]] && FULL="$FULL --target ${{ inputs.target }}"
          FULL="$(echo "$FULL" | sed 's/^[[:space:]]*//')"
          echo "Computed tauri args: $FULL"
          {
            echo "args<<TAURI_ARGS_EOF"
            echo "$FULL"
            echo "TAURI_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/binaries/ffmpeg-*
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('desktop/src-tauri/build.rs', 'desktop/src-tauri/build/ffmpeg.rs') }}

      - name: Build with Tauri
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ inputs.sign-binaries && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ inputs.sign-binaries && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_PASSWORD: ${{ inputs.sign-binaries && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign-binaries && secrets.APPLE_TEAM_ID || '' }}
          APPLE_CERTIFICATE: ${{ inputs.sign-binaries && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign-binaries && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.sign-binaries && env.CERT_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MEETFREE_RSA_PUBLIC_KEY: ${{ secrets.MEETFREE_RSA_PUBLIC_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseId: ${{ inputs.release-id }}
          args: ${{ steps.tauri-args.outputs.args }}

      # ── Post-build: AppImage wayland fix ──────────────────────────
      - name: Remove libwayland-client.so from AppImage
        if: contains(inputs.platform, 'ubuntu')
        run: |
          APPIMAGE_PATH=$(find "target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/appimage" -name "*.AppImage" 2>/dev/null | head -1)
          if [ -z "$APPIMAGE_PATH" ]; then
            echo "No AppImage found to process"
            exit 0
          fi

          echo "Processing AppImage: $APPIMAGE_PATH"
          chmod +x "$APPIMAGE_PATH"
          cd "$(dirname "$APPIMAGE_PATH")"
          APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")

          "./$APPIMAGE_NAME" --appimage-extract
          find squashfs-root -name "libwayland-client.so*" -type f -delete

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream squashfs-root "$APPIMAGE_NAME"
          rm -rf squashfs-root appimagetool-x86_64.AppImage

      # ── Upload artifacts ──────────────────────────────────────────
      - name: Upload artifacts (macOS)
        if: ${{ inputs.upload-artifacts && contains(inputs.platform, 'macos') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: |
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/dmg/*.dmg
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app.tar.gz
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

      - name: Upload artifacts (Linux)
        if: ${{ inputs.upload-artifacts && contains(inputs.platform, 'ubuntu') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.platform }}-${{ inputs.target }}
          path: |
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/deb/*.deb
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/appimage/*.AppImage
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/rpm/*.rpm
          retention-days: 30

      - name: Upload artifacts (Windows)
        if: ${{ inputs.upload-artifacts && contains(inputs.platform, 'windows') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: |
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/msi/*.msi
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/msi/*.msi.sig
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/nsis/*.exe
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/nsis/*.exe.sig
          retention-days: 30
