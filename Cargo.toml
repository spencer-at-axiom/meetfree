[workspace]
resolver = "2"
members = [
    "desktop/src-tauri"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.80"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }
esaxx-rs = { git = "https://github.com/thewh1teagle/esaxx-rs.git", branch = "feat/dynamic-msvc-link" }

[profile.dev]
# Speed up dev builds by using more parallel codegen units
codegen-units = 256
# Reduce optimization for faster compilation
opt-level = 0
# Enable incremental compilation
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
